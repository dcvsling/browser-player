<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Player AI</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@0..1"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-pending">
    <div id="loadingOverlay" class="overlay hidden" aria-live="polite" aria-busy="true">
      <div class="overlay-card">
        <div class="spinner" aria-hidden="true"></div>
        <div id="loadingText">更新中...</div>
      </div>
    </div>

    <header class="topbar">
      <h1>Browser Player AI</h1>
      <nav class="main-nav">
        <button id="navPlayerBtn" type="button" data-route="/player" class="icon-btn" aria-label="播放器" title="播放器">
          <span class="material-symbols-rounded" aria-hidden="true">smart_display</span>
        </button>
        <button id="navPlaylistBtn" type="button" data-route="/playlist" class="icon-btn" aria-label="播放清單" title="播放清單">
          <span class="material-symbols-rounded" aria-hidden="true">queue_music</span>
        </button>
        <button id="navSettingsBtn" type="button" data-route="/settings" class="icon-btn" aria-label="設定" title="設定">
          <span class="material-symbols-rounded" aria-hidden="true">settings</span>
        </button>
      </nav>
      <div class="auth-actions">
        <div id="accountBadge" class="account-badge">
          <img id="accountAvatar" class="account-avatar hidden" alt="" />
          <span id="accountFallback" class="account-fallback" aria-hidden="true">?</span>
          <span id="accountLabel" class="visually-hidden">未登入</span>
        </div>
        <button id="loginBtn" type="button" class="icon-btn" aria-label="登入 OneDrive" title="登入 OneDrive">
          <span class="material-symbols-rounded" aria-hidden="true">login</span>
        </button>
        <button id="logoutBtn" type="button" class="icon-btn" aria-label="登出" title="登出">
          <span class="material-symbols-rounded" aria-hidden="true">logout</span>
        </button>
      </div>
    </header>

    <main class="layout">
      <section id="playerPanel" class="panel player-panel">
        <div class="video-wrap">
          <video id="video" preload="metadata"></video>
          <div class="player-overlay top">
            <div class="player-head">
              <div class="player-meta">
                <div class="now-playing">
                  <strong>正在播放：</strong>
                  <span id="nowPlaying">尚未選擇影片</span>
                  <span id="inlineLoading" class="inline-loading hidden">讀取影片中...</span>
                </div>
                <div id="activeListLabel" class="sync-info"></div>
              </div>
              <button
                id="queueToggleBtn"
                type="button"
                class="queue-toggle icon-btn"
                aria-expanded="false"
                aria-label="開啟側邊清單"
                title="播放清單"
              >
                <span class="material-symbols-rounded" aria-hidden="true">playlist_play</span>
              </button>
            </div>
          </div>
          <div class="player-overlay bottom">
            <div class="progress-panel">
              <input id="progressInput" type="range" min="0" max="1000" step="1" value="0" />
              <div id="playbackTime" class="sync-info">00:00 / 00:00</div>
            </div>
            <div class="controls-row">
              <div class="controls player-controls">
                <button id="prevBtn" type="button" class="icon-btn" aria-label="上一部" title="上一部">
                  <span class="material-symbols-rounded" aria-hidden="true">skip_previous</span>
                </button>
                <button id="rewindBtn" type="button" class="icon-btn" aria-label="倒退 10 秒" title="倒退 10 秒">
                  <span class="material-symbols-rounded" aria-hidden="true">replay_10</span>
                </button>
                <button
                  id="playBtn"
                  type="button"
                  class="icon-btn"
                  aria-label="播放"
                  title="播放/暫停"
                >
                  <span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>
                </button>
                <button id="forwardBtn" type="button" class="icon-btn" aria-label="快轉 10 秒" title="快轉 10 秒">
                  <span class="material-symbols-rounded" aria-hidden="true">forward_10</span>
                </button>
                <button id="nextBtn" type="button" class="icon-btn" aria-label="下一部" title="下一部">
                  <span class="material-symbols-rounded" aria-hidden="true">skip_next</span>
                </button>
                <button
                  id="fullscreenBtn"
                  type="button"
                  class="icon-btn"
                  aria-label="全螢幕"
                  title="全螢幕"
                >
                  <span class="material-symbols-rounded" aria-hidden="true">open_in_full</span>
                </button>
              </div>
              <div class="controls player-secondary-controls">
                <button id="shuffleBtn" type="button" class="icon-btn" aria-label="隨機" title="隨機">
                  <span class="material-symbols-rounded" aria-hidden="true">shuffle</span>
                </button>
                <button id="repeatBtn" type="button" class="icon-btn" aria-label="循環" title="循環">
                  <span class="material-symbols-rounded" aria-hidden="true">repeat</span>
                </button>
                <button id="muteBtn" type="button" class="icon-btn" aria-label="靜音" title="靜音">
                  <span class="material-symbols-rounded" aria-hidden="true">volume_up</span>
                </button>
                <label class="overlay-control" aria-label="音量">
                  <span class="visually-hidden">音量</span>
                  <input id="volumeInput" type="range" min="0" max="1" step="0.01" />
                </label>
                <label class="overlay-select" aria-label="播放速度">
                  <span class="visually-hidden">播放速度</span>
                  <select id="speedSelect" title="播放速度">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                  </select>
                </label>
              </div>
            </div>
          </div>
        </div>
        <aside id="queueDrawer" class="queue-drawer hidden">
          <div class="queue-head">
            <strong>播放清單</strong>
            <div class="head-actions">
              <label class="sort-select" aria-label="播放清單排序欄位">
                <span class="visually-hidden">播放清單排序欄位</span>
                <select id="queueSortFieldSelect" title="排序欄位">
                  <option value="name">名稱</option>
                  <option value="modifiedAt">更新</option>
                  <option value="sizeBytes">大小</option>
                </select>
              </label>
              <button id="queueSortDirectionBtn" type="button" class="icon-btn" aria-label="切換排序方向" title="切換排序方向">
                <span class="material-symbols-rounded" aria-hidden="true">arrow_upward</span>
              </button>
              <button id="queueViewModeBtn" type="button" class="icon-btn" aria-label="切換清單檢視模式" title="切換清單檢視模式">
                <span class="material-symbols-rounded" aria-hidden="true">view_agenda</span>
              </button>
              <button id="queueCloseBtn" type="button" class="icon-btn" aria-label="收起播放清單" title="收起播放清單">
                <span class="material-symbols-rounded" aria-hidden="true">close</span>
              </button>
            </div>
          </div>
          <ul id="playQueueList" class="list compact"></ul>
        </aside>
      </section>

      <section id="libraryPanel" class="panel library-panel">
        <div class="panel-head">
          <h2>OneDrive 影片（mp4）</h2>
          <div class="head-actions">
            <label class="sort-select" aria-label="雲端清單排序欄位">
              <span class="visually-hidden">雲端清單排序欄位</span>
              <select id="cloudSortFieldSelect" title="排序欄位">
                <option value="name">名稱</option>
                <option value="modifiedAt">更新</option>
                <option value="sizeBytes">大小</option>
              </select>
            </label>
            <button id="cloudSortDirectionBtn" type="button" class="icon-btn" aria-label="切換排序方向" title="切換排序方向">
              <span class="material-symbols-rounded" aria-hidden="true">arrow_upward</span>
            </button>
            <button id="cloudViewModeBtn" type="button" class="icon-btn" aria-label="切換清單檢視模式" title="切換清單檢視模式">
              <span class="material-symbols-rounded" aria-hidden="true">view_agenda</span>
            </button>
            <button id="refreshBtn" type="button" class="icon-btn" aria-label="更新雲端清單" title="更新雲端清單">
              <span class="material-symbols-rounded" aria-hidden="true">refresh</span>
            </button>
          </div>
        </div>
        <div id="syncInfo" class="sync-info"></div>
        <ul id="cloudList" class="list"></ul>
      </section>

      <section id="customPanel" class="panel custom-panel">
        <div class="panel-head">
          <h2>自訂播放清單</h2>
          <div class="head-actions">
            <label class="sort-select" aria-label="自訂清單排序欄位">
              <span class="visually-hidden">自訂清單排序欄位</span>
              <select id="customSortFieldSelect" title="排序欄位">
                <option value="name">名稱</option>
                <option value="modifiedAt">更新</option>
                <option value="sizeBytes">大小</option>
              </select>
            </label>
            <button id="customSortDirectionBtn" type="button" class="icon-btn" aria-label="切換排序方向" title="切換排序方向">
              <span class="material-symbols-rounded" aria-hidden="true">arrow_upward</span>
            </button>
            <button id="customViewModeBtn" type="button" class="icon-btn" aria-label="切換清單檢視模式" title="切換清單檢視模式">
              <span class="material-symbols-rounded" aria-hidden="true">view_agenda</span>
            </button>
          </div>
        </div>
        <div class="list-tools">
          <select id="customListSelect"></select>
          <button id="newListBtn" type="button" class="icon-btn" aria-label="新增清單" title="新增清單">
            <span class="material-symbols-rounded" aria-hidden="true">add</span>
          </button>
          <button id="deleteListBtn" type="button" class="icon-btn" aria-label="刪除清單" title="刪除清單">
            <span class="material-symbols-rounded" aria-hidden="true">delete</span>
          </button>
          <button id="setActiveListBtn" type="button" class="icon-btn" aria-label="設為播放器清單" title="設為播放器清單">
            <span class="material-symbols-rounded" aria-hidden="true">task_alt</span>
          </button>
        </div>
        <div id="editingListLabel" class="sync-info"></div>
        <ul id="customTracks" class="list compact"></ul>
      </section>

      <section id="settingsPanel" class="panel settings-panel hidden">
        <div class="panel-head">
          <h2>設定</h2>
          <div class="sync-info">會自動保存，下次開啟會直接還原</div>
        </div>
        <div class="settings-grid">
          <section class="settings-card">
            <h3>快捷鍵</h3>
            <label class="setting-toggle">
              <input id="hotkeysToggle" type="checkbox" />
              啟用快捷鍵
            </label>
            <div class="shortcut-editor">
              <label class="shortcut-row"><span>播放/暫停</span><input id="shortcut-playPause" class="shortcut-input" type="text" readonly /></label>
              <label class="shortcut-row"><span>倒退 10 秒</span><input id="shortcut-seekBack" class="shortcut-input" type="text" readonly /></label>
              <label class="shortcut-row"><span>快轉 10 秒</span><input id="shortcut-seekForward" class="shortcut-input" type="text" readonly /></label>
              <label class="shortcut-row"><span>上一部</span><input id="shortcut-prevTrack" class="shortcut-input" type="text" readonly /></label>
              <label class="shortcut-row"><span>下一部</span><input id="shortcut-nextTrack" class="shortcut-input" type="text" readonly /></label>
              <label class="shortcut-row"><span>靜音</span><input id="shortcut-toggleMute" class="shortcut-input" type="text" readonly /></label>
              <label class="shortcut-row"><span>隨機</span><input id="shortcut-toggleShuffle" class="shortcut-input" type="text" readonly /></label>
              <label class="shortcut-row"><span>循環</span><input id="shortcut-cycleRepeat" class="shortcut-input" type="text" readonly /></label>
              <label class="shortcut-row"><span>播放清單</span><input id="shortcut-toggleQueue" class="shortcut-input" type="text" readonly /></label>
              <label class="shortcut-row"><span>全螢幕</span><input id="shortcut-toggleFullscreen" class="shortcut-input" type="text" readonly /></label>
            </div>
            <div class="settings-actions">
              <button id="resetHotkeysBtn" type="button" class="icon-btn" aria-label="重設快捷鍵" title="重設快捷鍵">
                <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span>
              </button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
